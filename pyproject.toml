[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barometer"
version = "0.1.0"
description = "Private, single-user relationship barometer for a Raspberry Pi."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "anthropic>=2.3",
  "pynacl>=1.5",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.0"]
sqlcipher = ["sqlcipher3>=0.5"]
dev = ["pytest>=8"]

[project.scripts]
barometer = "barometer.cli:main"

[tool.setuptools.packages.find]
include = ["barometer*"]

[tool.setuptools.package-data]
barometer = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
